slug: smear-jump
title: Smear Jump（タップで飛ぶ変形スミア）
status: active
priority: 2
stage: prototype
summary: タップした位置へ絵が飛び、帯ごとに遅れて引き伸ばされる変形スミアのWebデモ。WebGL2の1枚HTMLで、既定は走る馬の動く絵（再生中のコマがそのまま伸びる）
question: 手描きアニメのスミアを、どこまで軽い仕組みでリアルタイムに再現できるか
next:
  - 動く絵を、個人の環境で生成した素材（跳ねる動物）に差し替える
  - 実機のスマホで操作感（タップ・つまみ・速度）を確かめる
  - 弧と回転を大きくしたときの尾の崩れ方を詰める
  - GitHub Pages で公開する
